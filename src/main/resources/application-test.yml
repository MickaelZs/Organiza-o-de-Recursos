spring:
  datasource:
    url: ${TEST_DB_URL:jdbc:postgresql://localhost:5432/organizacao_recursos_test}
    username: ${TEST_DB_USERNAME:postgres}
    password: ${TEST_DB_PASSWORD:}
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
      - org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration

app:
  jwt:
    secret: dGVzdC1qd3Qtc2VjcmV0LXdpdGgtYXQtbGVhc3QtMzItYnl0ZXMtbG9uZw==

# Evita que um DEBUG global do ambiente imprima propriedades sensiveis de teste.
logging:
  level:
    org.springframework.boot.env.OriginTrackedYamlLoader: INFO
